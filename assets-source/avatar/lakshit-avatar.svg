  <path d="M326 433c22-20 59-24 98-9 7 3 8 9 1 13-34 9-67 9-98 3-7-1-8-4-1-7Z" fill="#19131d"/>
  <path d="M574 433c-22-20-59-24-98-9-7 3-8 9-1 13 34 9 67 9 98 3 7-1 8-4 1-7Z" fill="#19131d"/>
  <path d="M339 428c25-12 51-13 76-5M561 428c-25-12-51-13-76-5" fill="none" stroke="#4a3341" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

