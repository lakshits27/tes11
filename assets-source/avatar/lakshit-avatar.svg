  <g clip-path="url(#faceClip)">
    <rect x="270" y="150" width="360" height="620" fill="url(#skinShade)"/>
    <ellipse cx="353" cy="548" rx="62" ry="38" fill="url(#cheek)"/>
    <ellipse cx="547" cy="548" rx="62" ry="38" fill="url(#cheek)" opacity="0.6"/>
    <path d="M450 178v493" fill="none" stroke="#ffe2c1" stroke-width="20" opacity="0.08"/>
    <path d="M298 555c5 112 68 194 152 210-84-8-148-90-157-207l5-3Z" fill="#6e3739" opacity="0.12"/>
