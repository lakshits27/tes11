<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Lavi — illustrated portrait</title>
  <desc id="desc">An original editorial-style cartoon portrait of a young man with thick textured dark hair, warm skin, defined brows, light facial hair, calm brown eyes, and a modern dark jacket with subtle violet and cyan rim light.</desc>
  <defs>
    <linearGradient id="skin" x1="0.1" y1="0.04" x2="0.9" y2="0.96">
      <stop offset="0" stop-color="#ffd9ad"/>
      <stop offset="0.32" stop-color="#f2b27f"/>
      <stop offset="0.66" stop-color="#d28a5f"/>
      <stop offset="1" stop-color="#9a5944"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#713b3d" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#713b3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe0bb" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="neckShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d3a3c" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#6d3a3c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.04" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#39334b"/>
      <stop offset="0.32" stop-color="#1a1b2a"/>
      <stop offset="0.7" stop-color="#10121d"/>
      <stop offset="1" stop-color="#2d2135"/>
    </linearGradient>
    <linearGradient id="hairLock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#453b58"/>
      <stop offset="1" stop-color="#151625"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0.05" y1="0" x2="0.94" y2="1">
      <stop offset="0" stop-color="#29324b"/>
      <stop offset="0.48" stop-color="#171d30"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#414762"/>
      <stop offset="1" stop-color="#151829"/>
    </linearGradient>
    <linearGradient id="rimViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b69bff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#b69bff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#69e6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#69e6ff" stop-opacity="0.78"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.45" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#8a5b3f"/>
      <stop offset="0.58" stop-color="#4c302c"/>
      <stop offset="1" stop-color="#21171d"/>
    </radialGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8f81" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ff8f81" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1d24" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1a111a" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="stubble" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="1" fill="#2c1b22" opacity="0.5"/>
      <circle cx="8" cy="8" r="0.85" fill="#2c1b22" opacity="0.38"/>
      <circle cx="11" cy="2" r="0.65" fill="#2c1b22" opacity="0.3"/>
    </pattern>
    <filter id="softShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="faceClip">
      <path d="M450 164c109 0 175 78 172 197l-8 150c-9 137-75 231-164 245-89-14-155-108-164-245l-8-150c-3-119 63-197 172-197Z"/>
    </clipPath>
    <clipPath id="hairClip">
      <path d="M247 405c-25-76-9-168 45-226 48-51 112-79 181-69 78 11 137 66 157 143 13 51 3 100-20 140-4-51-21-91-52-118-36 28-78 43-121 40-46-3-83-17-116-2-30 14-53 44-68 86l-6 6Z"/>
    </clipPath>
  </defs>

  <!-- silhouette shadow -->
  <path d="M131 1100c12-150 65-247 180-291l73-26h132l73 26c115 44 168 141 180 291H131Z" fill="#03040a" opacity="0.64" filter="url(#softShadow)"/>

