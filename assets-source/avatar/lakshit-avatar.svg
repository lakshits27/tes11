    <path d="M324 398c22-19 47-22 74-10M576 398c-22-19-47-22-74-10" fill="none" stroke="#fff0d8" stroke-width="8" opacity="0.12"/>
    <path d="M322 526c14 16 31 24 50 24M578 526c-14 16-31 24-50 24" fill="none" stroke="#8d4d43" stroke-width="4" opacity="0.24"/>
