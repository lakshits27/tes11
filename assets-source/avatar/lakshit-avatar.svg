  <path d="M410 571c9 7 19 9 29 5M461 576c10 4 20 2 29-5" fill="none" stroke="#713d37" stroke-width="4" stroke-linecap="round" opacity="0.76"/>
  <path d="M444 479c-8 37-14 58-22 72" fill="none" stroke="#ffdbb2" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M433 566c5 6 12 8 17 7" fill="none" stroke="#ffd1a6" stroke-width="3" opacity="0.5"/>

  <!-- moustache and mouth -->
  <path d="M386 586c20-13 43-13 64-1 21-12 44-12 64 1-9 17-35 25-64 14-29 11-55 3-64-14Z" fill="#2c1c23" opacity="0.27"/>
  <path d="M387 615c24 10 44 14 63 14s39-4 63-14c-12 27-38 42-63 42s-51-15-63-42Z" fill="#372126" opacity="0.7"/>
  <path d="M397 618c17 6 35 9 53 9s36-3 53-9c-15 12-33 18-53 18s-38-6-53-18Z" fill="#eaa084" opacity="0.28"/>
  <path d="M404 642c15 9 31 13 46 13s31-4 46-13" fill="none" stroke="#ffcaa4" stroke-width="3" opacity="0.25"/>
  <path d="M333 551c18 10 40 14 60 12M567 551c-18 10-40 14-60 12" fill="none" stroke="#2f1e25" stroke-width="7" stroke-linecap="round" opacity="0.42"/>

